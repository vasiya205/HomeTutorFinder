# API Gateway - the single URL the frontend talks to (http://localhost:8080).
server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            # Comma separated; wildcards such as https://*.vercel.app are allowed.
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://${AUTH_SERVICE_HOSTPORT:localhost:8081}}
          predicates:
            - Path=/api/auth/**
        - id: tutor-service
          uri: ${TUTOR_SERVICE_URL:http://${TUTOR_SERVICE_HOSTPORT:localhost:8082}}
          predicates:
            - Path=/api/tutors/**
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://${BOOKING_SERVICE_HOSTPORT:localhost:8083}}
          predicates:
            - Path=/api/bookings/**,/api/reviews/**,/api/admin/bookings/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://${NOTIFICATION_SERVICE_HOSTPORT:localhost:8084}}
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    com.netflix.discovery: warn
