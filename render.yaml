# Render Blueprint - deploys the database, the 5 API services and the React site.
# Render dashboard -> New -> Blueprint -> pick this repository.
# See docs/DEPLOYMENT.md for the 3 values you must fill in after the first deploy.
envVarGroups:
  - name: htf-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: EUREKA_ENABLED
        value: "false"
      - key: DB_AUTO_CREATE
        value: "false"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: FRONTEND_URL
        sync: false

databases:
  - name: htf-postgres
    databaseName: hometutor
    plan: free

services:
  - type: web
    name: htf-auth
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/auth-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: htf-shared
      - { key: PORT, value: "10000" }
      - { key: DB_HOST, fromDatabase: { name: htf-postgres, property: host } }
      - { key: DB_PORT, fromDatabase: { name: htf-postgres, property: port } }
      - { key: DB_USERNAME, fromDatabase: { name: htf-postgres, property: user } }
      - { key: DB_PASSWORD, fromDatabase: { name: htf-postgres, property: password } }
      - { key: AUTH_DB_NAME, fromDatabase: { name: htf-postgres, property: database } }
      - { key: NOTIFICATION_SERVICE_URL, sync: false }

  - type: web
    name: htf-tutor
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/tutor-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: htf-shared
      - { key: PORT, value: "10000" }
      - { key: DB_HOST, fromDatabase: { name: htf-postgres, property: host } }
      - { key: DB_PORT, fromDatabase: { name: htf-postgres, property: port } }
      - { key: DB_USERNAME, fromDatabase: { name: htf-postgres, property: user } }
      - { key: DB_PASSWORD, fromDatabase: { name: htf-postgres, property: password } }
      - { key: TUTOR_DB_NAME, fromDatabase: { name: htf-postgres, property: database } }

  - type: web
    name: htf-booking
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/booking-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: htf-shared
      - { key: PORT, value: "10000" }
      - { key: DB_HOST, fromDatabase: { name: htf-postgres, property: host } }
      - { key: DB_PORT, fromDatabase: { name: htf-postgres, property: port } }
      - { key: DB_USERNAME, fromDatabase: { name: htf-postgres, property: user } }
      - { key: DB_PASSWORD, fromDatabase: { name: htf-postgres, property: password } }
      - { key: BOOKING_DB_NAME, fromDatabase: { name: htf-postgres, property: database } }
      - { key: TUTOR_SERVICE_URL, sync: false }
      - { key: NOTIFICATION_SERVICE_URL, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }

  - type: web
    name: htf-notification
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/notification-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: htf-shared
      - { key: PORT, value: "10000" }
      - { key: DB_HOST, fromDatabase: { name: htf-postgres, property: host } }
      - { key: DB_PORT, fromDatabase: { name: htf-postgres, property: port } }
      - { key: DB_USERNAME, fromDatabase: { name: htf-postgres, property: user } }
      - { key: DB_PASSWORD, fromDatabase: { name: htf-postgres, property: password } }
      - { key: NOTIFICATION_DB_NAME, fromDatabase: { name: htf-postgres, property: database } }
      - { key: MAIL_USERNAME, sync: false }
      - { key: MAIL_PASSWORD, sync: false }

  - type: web
    name: htf-gateway
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/api-gateway/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - { key: PORT, value: "10000" }
      - { key: EUREKA_ENABLED, value: "false" }
      - { key: CORS_ALLOWED_ORIGINS, value: "https://*.onrender.com,http://localhost:5173" }
      - { key: AUTH_SERVICE_URL, sync: false }
      - { key: TUTOR_SERVICE_URL, sync: false }
      - { key: BOOKING_SERVICE_URL, sync: false }
      - { key: NOTIFICATION_SERVICE_URL, sync: false }

  - type: web
    name: htf-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - { key: VITE_API_BASE_URL, sync: false }
